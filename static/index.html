<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <!-- 1순위: 모바일 좌우 짤림 방지 핵심 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>K-Beauty Intelligence</title>
    
    <!-- 2순위: Fuse.js (AI 자동완성 검색 엔진) -->
    <script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0"></script>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <!-- 📌 상단 고정 네비게이션 (어디서든 탭 이동 가능) -->
    <header class="global-header">
        <div class="header-top">
            <h1 class="logo">🌸 K-Beauty</h1>
        </div>
        <nav class="tabs">
            <button class="tab-btn active" data-tab="dashboard">📊 대시보드</button>
            <button class="tab-btn" data-tab="ai-trends">🤖 AI 트렌드</button>
            <button class="tab-btn" data-tab="ingredients">🌿 성분별</button>
        </nav>
    </header>

    <main class="container">
        <!-- 🔍 스마트 검색창 -->
        <div class="search-wrapper">
            <div class="search-input-box">
                <span class="search-icon">🔍</span>
                <input type="text" id="searchInput" placeholder="상품명, 브랜드, 성분 검색 (예: PDRN, 세라마이드)">
            </div>
            <div id="searchSuggestions" class="suggestions-box"></div>
        </div>

        <!-- 📊 탭 1: 대시보드 -->
        <section id="dashboard-tab" class="tab-content active">
            <div class="section-header">
                <h2>🔥 올리브영 순위 급상승</h2>
                <span class="subtitle">어제 대비 랭킹 변동</span>
            </div>
            <div id="olive-rising" class="product-grid"></div>

            <div class="section-header" style="margin-top: 40px;">
                <h2>💎 다이소 뷰티 베스트</h2>
                <span class="subtitle">가성비 인기 상품</span>
            </div>
            <div id="daiso-best" class="product-grid"></div>
        </section>

        <!-- 🤖 탭 2: AI 트렌드 -->
        <section id="ai-trends-tab" class="tab-content">
            <h2>AI 트렌드 분석</h2>
            <div id="trend-container">데이터를 불러오는 중...</div>
        </section>

        <!-- 🌿 탭 3: 성분별 -->
        <section id="ingredients-tab" class="tab-content">
            <h2>성분별 추천</h2>
            <div id="ingredient-container">준비 중...</div>
        </section>
    </main>

    <script src="/static/app.js"></script>
</body>
</html>
