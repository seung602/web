<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>일일 랭킹 - K-Beauty 소싱 가이드</title>
    <style>
        :root { --bg: #0b1020; --card: #161d36; --card2: #1e2749; --text: #eef1ff; --muted: #8f97bd; --accent: #7c5cff; --green: #3ddc97; --yellow: #ffd166; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, sans-serif; padding: 16px; max-width: 900px; margin: 0 auto; }
        .hero { background: linear-gradient(135deg, #1b2340, #2a1b4d); border-radius: 20px; padding: 24px; margin-bottom: 20px; }
        h1 { font-size: 24px; margin-bottom: 8px; }
        h2 { font-size: 18px; margin: 24px 0 12px; }
        .muted { color: var(--muted); font-size: 12px; }
        .card { background: var(--card); border-radius: 16px; padding: 16px; margin-bottom: 16px; }
        
        /* 탭 스타일 */
        .tabs { display: flex; gap: 8px; margin-bottom: 20px; border-bottom: 1px solid #2a3560; padding-bottom: 12px; }
        .tab-btn { background: var(--card); border: 1px solid #2a3560; color: var(--muted); padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .tab-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
        
        /* 키워드 칩 */
        .chips { display: flex; gap: 8px; flex-wrap: wrap; }
        .chip { background: var(--card2); border: 1px solid #2a3560; border-radius: 999px; padding: 8px 14px; font-size: 13px; cursor: pointer; transition: all 0.2s; }
        .chip:hover { border-color: var(--accent); color: var(--accent); }
        .chip .score { color: var(--yellow); margin-left: 6px; }
        
        /* 하이라이트 그리드 */
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        @media (max-width: 600px) { .grid-2 { grid-template-columns: 1fr; } }
        .hl-card { background: var(--card2); border-radius: 12px; padding: 14px; }
        .hl-card h3 { font-size: 15px; margin-bottom: 10px; color: var(--accent); }
        
        /* 리스트 */
        .row { display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 8px; cursor: pointer; transition: background 0.1s; }
        .row:hover { background: var(--card2); }
        .rank-badge { min-width: 28px; height: 28px; border-radius: 6px; background: var(--accent); display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 12px; }
        .info { flex: 1; min-width: 0; }
        .info b { font-size: 14px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .badge { padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: bold; }
        .badge-oy { background: #e0f7e9; color: #04291a; }
        .badge-ds { background: #ffe0b2; color: #3e2723; }
        
        /* 모달 */
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center; z-index: 100; padding: 20px; }
        .modal.open { display: flex; }
        .modal-content { background: var(--card); border-radius: 16px; max-width: 600px; width: 100%; max-height: 80vh; overflow-y: auto; padding: 20px; }
        .close-btn { float: right; background: var(--card2); border: none; color: var(--text); padding: 6px 10px; border-radius: 6px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="hero">
        <h1>📊 일일 랭킹</h1>
        <p class="muted">올리브영 · 다이소 뷰티 소싱 인사이트</p>
    </div>

    <!-- 기간 선택 -->
    <div class="tabs">
        <button class="tab-btn active" data-period="daily">일간 (Daily)</button>
        <button class="tab-btn" data-period="weekly">주간 (Weekly)</button>
        <button class="tab-btn" data-period="monthly">월간 (Monthly)</button>
    </div>

    <!-- 트렌드 키워드 -->
    <h2>🔥 트렌드 키워드</h2>
    <div class="chips" id="trendChips">로딩 중...</div>

    <!-- 플랫폼별 하이라이트 -->
    <h2>🛒 플랫폼별 하이라이트</h2>
    <div class="grid-2">
        <div class="hl-card">
            <h3>🌿 올리브영 (순위 급등 · 신규)</h3>
            <div id="hlOliveyoung"></div>
        </div>
        <div class="hl-card">
            <h3>💸 다이소 (리뷰 폭주 · 신상)</h3>
            <div id="hlDaiso"></div>
        </div>
    </div>

    <!-- 랭킹 -->
    <h2>🏆 누적 랭킹</h2>
    <div class="tabs">
        <button class="tab-btn active" data-rank="overall">전체 랭킹</button>
        <button class="tab-btn" data-rank="oliveyoung">올리브영</button>
        <button class="tab-btn" data-rank="daiso">다이소</button>
    </div>
    <div class="card" id="rankingsList"></div>

    <!-- 키워드 상세 모달 -->
    <div class="modal" id="keywordModal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal()">✕ 닫기</button>
            <h2 id="modalTitle"></h2>
            <p class="muted" style="margin-bottom:12px">매칭되는 전체 상품 목록</p>
            <div id="modalProducts"></div>
        </div>
    </div>

    <script>
        const $ = s => document.querySelector(s);
        const fmtPrice = v => v == null ? '' : '₩' + Number(v).toLocaleString('ko-KR');
        let currentPeriod = 'daily';
        let currentRankTab = 'overall';

        async function fetchDashboard(period) {
            try {
                const res = await fetch(`/api/app/dashboard?period=${period}`);
                const data = await res.json();
                renderDashboard(data);
            } catch (e) {
                console.error(e);
            }
        }

        function renderDashboard(data) {
            // 트렌드 키워드
            $('#trendChips').innerHTML = data.trends.map(t => 
                `<span class="chip" onclick="openKeywordModal('${t.keyword}')">${t.keyword}<span class="score">${Math.round(t.score || 0)}</span></span>`
            ).join('');

            // 하이라이트
            $('#hlOliveyoung').innerHTML = data.highlights.oliveyoung.map(p => renderRow(p, 'oy')).join('') || '<p class="muted">데이터 없음</p>';
            $('#hlDaiso').innerHTML = data.highlights.daiso.map(p => renderRow(p, 'ds')).join('') || '<p class="muted">데이터 없음</p>';

            // 랭킹
            renderRankings(data.rankings);
        }

        function renderRow(p, type) {
            const badge = type === 'oy' ? '<span class="badge badge-oy">🌿 올영</span>' : '<span class="badge badge-ds">💸 다이소</span>';
            return `
                <div class="row" onclick="window.open('${p.product_url}', '_blank')">
                    <div class="info"><b>${p.product_name}</b><span class="muted">${p.brand || ''}</span></div>
                    ${badge}
                    <span class="muted">${fmtPrice(p.price)}</span>
                </div>
            `;
        }

        function renderRankings(rankings) {
            const list = rankings[currentRankTab] || [];
            $('#rankingsList').innerHTML = list.map((p, i) => `
                <div class="row">
                    <span class="rank-badge">${i + 1}</span>
                    <div class="info"><b>${p.product_name}</b><span class="muted">${p.brand || ''}</span></div>
                    <span class="muted">${p.platform_badge || ''}</span>
                    <span class="muted">${fmtPrice(p.price)}</span>
                </div>
            `).join('') || '<p class="muted">랭킹 데이터가 없습니다.</p>';
        }

        async function openKeywordModal(kw) {
            $('#modalTitle').textContent = `#${kw}`;
            $('#modalProducts').innerHTML = '로딩 중...';
            $('#keywordModal').classList.add('open');
            
            try {
                const res = await fetch(`/api/app/keyword/${encodeURIComponent(kw)}`);
                const data = await res.json();
                $('#modalProducts').innerHTML = data.products.map(p => `
                    <div class="row" onclick="window.open('${p.product_url}', '_blank')">
                        <span class="badge ${p.platform_badge === '🌿' ? 'badge-oy' : 'badge-ds'}">${p.platform_badge}</span>
                        <div class="info"><b>${p.product_name}</b><span class="muted">${p.brand || ''} · ${fmtPrice(p.price)}</span></div>
                        <span class="muted">리뷰 ${p.review_count || 0}</span>
                    </div>
                `).join('') || '<p class="muted">매칭되는 상품이 없습니다.</p>';
            } catch (e) {
                $('#modalProducts').innerHTML = '<p class="muted">데이터 로드 실패</p>';
            }
        }

        function closeModal() {
            $('#keywordModal').classList.remove('open');
        }

        // 이벤트 리스너
        document.querySelectorAll('.tab-btn[data-period]').forEach(btn => {
            btn.onclick = () => {
                document.querySelectorAll('.tab-btn[data-period]').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentPeriod = btn.dataset.period;
                fetchDashboard(currentPeriod);
            };
        });

        document.querySelectorAll('.tab-btn[data-rank]').forEach(btn => {
            btn.onclick = () => {
                document.querySelectorAll('.tab-btn[data-rank]').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentRankTab = btn.dataset.rank;
                // 랭킹 데이터는 이미 로드되어 있으므로 UI만 재렌더링하려면 전역 변수 활용 필요
                // 여기서는 단순화를 위해 대시보드 전체 다시 로드
                fetchDashboard(currentPeriod); 
            };
        });

        // 초기 로드
        fetchDashboard(currentPeriod);
    </script>
</body>
</html>
