<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>K-Beauty Trend Intelligence</title>
<script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0"></script>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header class="global-header">
  <div class="header-top">
    <h1 class="logo">🌸 K-Beauty</h1>
    <div class="lang-switch">
      <button class="lang-btn active" data-lang="ko">KO</button>
      <button class="lang-btn" data-lang="en">EN</button>
      <button class="lang-btn" data-lang="ar">AR</button>
    </div>
  </div>
  <nav class="tabs">
    <button class="tab-btn active" data-tab="dashboard" data-i18n="dashboard">📊 대시보드</button>
    <button class="tab-btn" data-tab="ai" data-i18n="ai">🤖 AI 트렌드</button>
    <button class="tab-btn" data-tab="keywords" data-i18n="keywordsTab">🗂️ 키워드별</button>
  </nav>
  <!-- 🚨 전역 기간 스위치 (모든 탭에서 항상 보임) -->
  <div class="period-switch global-period">
    <span class="period-label" data-i18n="periodLabel">분석 기간</span>
    <button class="period-btn active" data-period="daily" data-i18n="daily">일간</button>
    <button class="period-btn" data-period="weekly" data-i18n="weekly">주간</button>
    <button class="period-btn" data-period="monthly" data-i18n="monthly">월간</button>
  </div>
</header>

<main class="container">

  <div class="search-wrapper">
    <div class="search-input-box">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" data-i18n-ph="search" placeholder="상품명·브랜드 검색 (예: PDRN, 세라마이드)">
    </div>
    <div id="searchSuggestions" class="suggestions-box"></div>
  </div>

  <section id="dashboard-tab" class="tab-content active">

    <section id="search-results" class="result-section" style="display:none;">
      <div class="section-header">
        <h2 id="search-results-title"></h2>
        <button class="close-btn" onclick="closeSearchResults()">✕</button>
      </div>
      <div id="search-results-grid" class="product-grid"></div>
    </section>

    <section id="keyword-match" class="result-section" style="display:none;">
      <div class="section-header">
        <h2 id="keyword-match-title"></h2>
        <button class="close-btn" onclick="closeKeywordMatch()">✕</button>
      </div>
      <div id="keyword-match-grid" class="product-grid"></div>
    </section>

    <div id="sec-rising">
      <div class="section-header">
        <div>
          <h2 data-i18n="rising">🔥 올리브영 순위 급등</h2>
          <span class="subtitle" id="rising-sub"></span>
        </div>
      </div>
      <div id="olive-rising" class="product-grid"></div>
    </div>

    <div id="sec-trends" style="margin-top:40px;">
      <div class="section-header">
        <div>
          <h2 data-i18n="trends">🌿 트렌드 키워드</h2>
          <span class="subtitle" data-i18n="trendsSub">키워드를 누르면 매칭 상품이 보여요</span>
        </div>
      </div>
      <div id="trend-keywords" class="keyword-grid"></div>
    </div>

    <div id="sec-daiso" style="margin-top:40px;">
      <div class="section-header">
        <div>
          <h2 data-i18n="daiso">💎 다이소 뷰티 베스트</h2>
          <span class="subtitle" data-i18n="daisoSub">리뷰·평점 기반 자체 랭킹</span>
        </div>
      </div>
      <div id="daiso-best" class="product-grid"></div>
    </div>

    <div id="sec-rankings" style="margin-top:40px;">
      <div class="section-header">
        <div>
          <h2 data-i18n="rankings">🏆 전체 상품 킹</h2>
          <span class="subtitle" data-i18n="rankingsSub">종합·올리브영·다이소</span>
        </div>
      </div>
      <div class="filter-switch">
        <button class="filter-btn active" data-filter="all" data-i18n="all">종합</button>
        <button class="filter-btn" data-filter="olive" data-i18n="olive">올리브영</button>
        <button class="filter-btn" data-filter="daiso" data-i18n="daiso">다이소</button>
      </div>
      <div id="all-rankings" class="product-grid"></div>
    </div>
  </section>

  <section id="ai-tab" class="tab-content">
    <div class="section-header">
      <div>
        <h2 data-i18n="aiTitle">AI 트렌드 분석</h2>
        <span class="subtitle" data-i18n="aiSub">상단에서 기간을 선택하세요</span>
      </div>
    </div>
    <div class="ai-card">
      <h3 data-i18n="aiSummary">📌 요약</h3>
      <p id="ai-summary" class="ai-summary">...</p>
      <h3 data-i18n="aiEvidence">🔗 근거</h3>
      <ul id="ai-evidence" class="ai-evidence"></ul>
    </div>
    <div class="ai-card">
      <h3 data-i18n="aiPopular">🛒 인기 상품</h3>
      <p id="ai-popular" class="ai-summary"></p>
    </div>
  </section>

  <section id="keywords-tab" class="tab-content">
    <div class="section-header">
      <div>
        <h2 data-i18n="kwTitle">🗂️ 키워드별 전체 상품</h2>
        <span class="subtitle" data-i18n="kwSub">키워드를 누르면 해당 전체 상품이 보여요</span>
      </div>
    </div>
    <div id="keyword-chips" class="keyword-grid"></div>
    <div id="keyword-results" class="product-grid" style="margin-top:20px;"></div>
  </section>

</main>
<script src="/static/keywords.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
