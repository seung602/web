<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>K-Beauty Trend Intelligence</title>
<style>
:root{--bg:#0b1020;--card:#161d36;--card2:#1e2749;--text:#eef1ff;--muted:#8f97bd;--accent:#7c5cff;--blue:#4da3ff;--green:#3ddc97;--yellow:#ffd166}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif;padding:16px;max-width:860px;margin:0 auto;padding-bottom:60px}
.hero{position:relative;background:linear-gradient(135deg,#1b2340,#2a1b4d);border-radius:20px;padding:24px 20px;margin-bottom:16px}
.hero h1{font-size:22px;margin-bottom:6px}
.hero p{color:var(--muted);font-size:12px}
.badge-date{display:inline-block;background:var(--card2);padding:5px 12px;border-radius:999px;font-size:11px;color:var(--muted);margin-top:10px}
.langs{position:absolute;top:16px;inset-inline-end:16px;display:flex;gap:6px}
.lang{background:var(--card2);border:1px solid #2a3560;color:var(--muted);border-radius:8px;padding:4px 9px;font-size:11px;cursor:pointer}
.lang.on{background:var(--accent);color:#fff;border-color:var(--accent)}
h2{font-size:16px;margin:22px 0 10px}
.muted{color:var(--muted);font-size:12px}
.card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:12px;background:var(--card2);border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.row:hover{outline:1px solid var(--accent)}
.rank{min-width:30px;height:30px;border-radius:8px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:13px}
.info{flex:1;min-width:0}
.info b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.price{font-size:13px;color:var(--green);font-weight:bold}
.badge{min-width:44px;text-align:center;padding:5px 8px;border-radius:8px;background:var(--green);color:#04291a;font-weight:bold;font-size:12px}
.badge.new{background:var(--blue);color:#03203c}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;flex-wrap:wrap}
.chip{flex:0 0 auto;background:var(--card);border-radius:12px;padding:8px 12px;font-size:12px;margin:2px}
.chip .score{color:var(--yellow);font-weight:bold;margin-inline-start:6px}
.kw-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.kw-tag{background:var(--accent);border-radius:8px;padding:4px 10px;font-size:12px;font-weight:bold}
input{width:100%;background:var(--card);border:1px solid #2a3560;border-radius:12px;padding:12px;color:var(--text);font-size:14px;margin-bottom:6px}
.link{color:var(--blue);font-size:12px;text-decoration:none}
#overlay{position:fixed;inset:0;background:rgba(4,8,20,.7);display:none;align-items:flex-end;justify-content:center;z-index:50}
#overlay.open{display:flex}
#sheet{background:var(--card);border-radius:20px 20px 0 0;max-width:860px;width:100%;max-height:80vh;overflow:auto;padding:20px}
.closebtn{float:right;background:var(--card2);border:none;color:var(--text);border-radius:8px;padding:6px 10px;cursor:pointer}
</style>
</head>
<body>
<div class="hero">
  <div class="langs">
    <button class="lang" data-lang="ko">한국어</button>
    <button class="lang" data-lang="en">EN</button>
    <button class="lang" data-lang="ar">العربية</button>
  </div>
  <h1>💄 K-Beauty Trend Intelligence</h1>
  <p id="subtitle"></p>
  <span class="badge-date" id="dateBadge"></span>
  <p style="margin-top:10px"><a class="link" id="fullRank" href="/static/catalog.html"></a></p>
</div>

<input id="searchInput" />
<div id="searchWrap"></div>

<h2 id="hTrends"></h2>
<div class="chips" id="trendChips"></div>

<h2 id="hMatches"></h2>
<div id="matchWrap"></div>

<h2 id="hRising"></h2>
<div id="risingWrap"></div>

<h2 id="hRankings"></h2>
<div id="rankWrap"></div>

<h2 id="hGoogle"></h2>
<div class="chips" id="googleWrap"></div>

<div id="overlay"><div id="sheet"></div></div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>(s??'').toString().replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtPrice=v=>v==null?'':'₩'+Number(v).toLocaleString('ko-KR');
async function api(p){const r=await fetch(p);if(!r.ok)throw new Error(p+' → '+r.status);return r.json();}

const I18N={
ko:{subtitle:'글로벌 트렌드 ↔ 국내 인기 상품 매칭 대시보드',fullRankings:'전체 랭킹 보기 →',search:'상품/브랜드 검색 (예: 토너, rice, 세라마이드...)',trends:'🔥 오늘의 트렌드 키워드',matches:'🎯 트렌드 × 인기 상품 매칭',rising:'🚀 순위 상승 상품',rankings:'🏆 오늘의 인기 상품 랭킹',google:'🌐 서구 시장 검색 시그널',score:'트렌드 점수',noMatch:'매칭된 상품이 없습니다.',noData:'데이터 없음',loading:'불러오는 중...',tL:'트렌드',cL:'상품',price:'최근 가격',rank:'최근 랭킹',open:'상품 페이지 열기 ↗',close:'✕ 닫기',new:'NEW',fail:'데이터 로드 실패: '},
en:{subtitle:'Global trends ↔ Korea top-product matching dashboard',fullRankings:'Full rankings →',search:'Search products/brands (e.g. toner, rice, ceramide...)',trends:"🔥 Today's Trend Keywords",matches:'🎯 Trend × Top Product Matches',rising:'🚀 Rising Products',rankings:"🏆 Today's Top Products",google:'🌐 Western Market Search Signals',score:'trend score',noMatch:'No matched products.',noData:'No data',loading:'Loading...',tL:'Trends',cL:'Catalog',price:'Recent prices',rank:'Recent rankings',open:'Open product page ↗',close:'✕ Close',new:'NEW',fail:'Load failed: '},
ar:{subtitle:'لوحة مطابقة الاتجاهات العالمية ↔ أفضل المنتجات في كوريا',fullRankings:'← عرض التصنيف الكامل',search:'بحث عن منتج/علامة (مثال: تونر، سيراميد...)',trends:'🔥 كلمات الاتجاه اليوم',matches:'🎯 مطابقة الاتجاه × المنتجات الشعبية',rising:'🚀 منتجات صاعدة',rankings:'🏆 أفضل المنتجات اليوم',google:'🌐 إشارات بحث الأسواق الغربية',score:'نقاط الاتجاه',noMatch:'لا توجد منتجات مطابقة.',noData:'لا توجد بيانات',loading:'جارٍ التحميل...',tL:'اتجاهات',cL:'منتجات',price:'آخر الأسعار',rank:'آخر التصنيفات',open:'↗ فتح صفحة المنتج',close:'إغلاق ✕',new:'جديد',fail:'فشل التحميل: '}
};
let LANG=localStorage.getItem('lang')||'ko';
let HOME=null;
const T=()=>I18N[LANG];

function applyLang(){
  const L=T();
  document.documentElement.lang=LANG;
  document.documentElement.dir=(LANG==='ar')?'rtl':'ltr';
  $('#subtitle').textContent=L.subtitle;
  $('#fullRank').textContent=L.fullRankings;
  $('#searchInput').placeholder=L.search;
  $('#hTrends').textContent=L.trends;
  $('#hMatches').textContent=L.matches;
  $('#hRising').textContent=L.rising;
  $('#hRankings').textContent=L.rankings;
  $('#hGoogle').textContent=L.google;
  document.querySelectorAll('.lang').forEach(b=>b.classList.toggle('on',b.dataset.lang===LANG));
  if(HOME)renderAll(HOME);
}
document.querySelectorAll('.lang').forEach(b=>b.onclick=()=>{LANG=b.dataset.lang;localStorage.setItem('lang',LANG);applyLang();});

function renderAll(H){
  const L=T();
  $('#dateBadge').textContent=L.tL+' '+(H.updated_at.trends||'-')+' · '+L.cL+' '+(H.updated_at.catalog||'-');
  $('#trendChips').innerHTML=H.top_trends.map(t=>'<span class="chip">'+esc(t.keyword)+'<span class="score">'+Math.round(t.score||0)+'</span></span>').join('');

  const mw=$('#matchWrap');mw.innerHTML='';
  if(!H.trend_product_matches.length){mw.innerHTML='<div class="card"><p class="muted">'+L.noMatch+'</p></div>';}
  H.trend_product_matches.forEach(m=>{
    const card=document.createElement('div');card.className='card';
    card.innerHTML='<div class="kw-head"><span class="kw-tag">#'+esc(m.keyword)+'</span><span class="muted">'+L.score+' '+Math.round(m.score||0)+'</span></div>';
    m.products.forEach(p=>{
      const row=document.createElement('div');row.className='row';
      row.innerHTML='<div class="info"><b>'+esc(p.product_name)+'</b><span class="muted">'+esc(p.brand||'')+' · '+esc(p.category||'')+'</span></div>';
      row.onclick=()=>openDetail(p.product_id);
      card.appendChild(row);
    });
    mw.appendChild(card);
  });

  const rw=$('#risingWrap');rw.innerHTML='';
  H.rising_products.slice(0,10).forEach(it=>{
    const row=document.createElement('div');row.className='row';
    row.innerHTML='<span class="badge'+(it.direction==='new'?' new':'')+'">'+(it.direction==='new'?L.new:'+'+it.rank_change)+'</span>'+
      '<div class="info"><b>'+esc(it.product_name||it.product_id)+'</b><span class="muted">'+esc(it.brand||'')+'</span></div>'+
      '<span class="muted">'+(it.previous_rank??'-')+' → '+it.current_rank+'</span>';
    row.onclick=()=>openDetail(it.product_id);
    rw.appendChild(row);
  });

  const kw=$('#rankWrap');kw.innerHTML='';
  H.top_rankings.forEach(it=>{
    const row=document.createElement('div');row.className='row';
    row.innerHTML='<span class="rank">'+it.rank_num+'</span>'+
      '<div class="info"><b>'+esc(it.product_name||it.product_id)+'</b><span class="muted">'+esc(it.brand||'')+'</span></div>'+
      '<span class="price">'+fmtPrice(it.sale_price??it.price)+'</span>';
    row.onclick=()=>openDetail(it.product_id);
    kw.appendChild(row);
  });

  $('#googleWrap').innerHTML=H.google_signals.map(g=>'<span class="chip">'+esc(g.keyword)+'<span class="score">'+esc(g.region||'')+' ↑'+Math.round(g.rising_score||0)+'</span></span>').join('')||'<span class="muted">'+L.noData+'</span>';
}

async function openDetail(pid){
  const L=T();
  try{
    const d=await api('/api/catalog/products/'+encodeURIComponent(pid));
    const p=d.product;
    $('#sheet').innerHTML='<button class="closebtn" onclick="closeDetail()">'+L.close+'</button>'+
      '<h3 style="margin:6px 0">'+esc(p.product_name)+'</h3>'+
      '<p class="muted">'+esc(p.brand)+' · '+esc(p.source)+' · '+esc(p.category)+' · '+esc(p.status)+'</p>'+
      '<p style="margin:10px 0"><a class="link" href="'+esc(p.product_url)+'" target="_blank">'+L.open+'</a></p>'+
      '<h4 class="muted">'+L.price+'</h4><div>'+d.snapshots.slice(0,7).map(s=>'<span class="chip">'+s.snapshot_date+' '+fmtPrice(s.sale_price??s.price)+'</span>').join('')+'</div>'+
      '<h4 class="muted">'+L.rank+'</h4><div>'+d.rankings.slice(0,10).map(r=>'<span class="chip">'+r.ranking_date+' · '+esc(r.source)+' · '+r.rank_num+'</span>').join('')+'</div>';
    $('#overlay').classList.add('open');
  }catch(e){alert(L.fail+e.message);}
}
function closeDetail(){$('#overlay').classList.remove('open');}
$('#overlay').addEventListener('click',e=>{if(e.target.id==='overlay')closeDetail();});

let t;
$('#searchInput').addEventListener('input',e=>{
  clearTimeout(t);
  t=setTimeout(async()=>{
    const q=e.target.value.trim(),wrap=$('#searchWrap');
    if(!q){wrap.innerHTML='';return;}
    const r=await api('/api/catalog/products?q='+encodeURIComponent(q)+'&limit=10');
    wrap.innerHTML='';
    r.items.forEach(it=>{
      const row=document.createElement('div');row.className='row';
      row.innerHTML='<div class="info"><b>'+esc(it.product_name)+'</b><span class="muted">'+esc(it.brand)+' · '+esc(it.source)+'</span></div>';
      row.onclick=()=>openDetail(it.product_id);
      wrap.appendChild(row);
    });
  },300);
});

(async()=>{
  applyLang();
  $('#dateBadge').textContent=T().loading;
  try{HOME=await api('/api/app/home');renderAll(HOME);}
  catch(e){$('#matchWrap').innerHTML='<div class="card"><p class="muted">'+T().fail+esc(e.message)+'</p></div>';}
})();
</script>
</body>
</html>
